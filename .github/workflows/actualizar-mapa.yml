name: Actualizar mapa desde OneDrive
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Leer Excel y generar datos públicos
        run: python actualizar_mapa.py
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_mapa.json ultima_actualizacion.json
          git diff --cached --quiet || (git commit -m "Actualizar datos del mapa desde OneDrive" && git push)

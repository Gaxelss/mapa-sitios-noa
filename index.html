const calles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {attribution:'Tiles &copy; Esri', maxZoom:19});
const oscuro = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {attribution:'Tiles &copy; Esri', maxZoom:16});
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'&copy; OpenStreetMap', maxZoom:19});
const map = L.map('map', {layers:[calles]});
L.control.layers({'Mapa de calles':calles,'Mapa oscuro':oscuro,'OpenStreetMap':osm}).addTo(map);
const COL={"Verde": "#2E7D32", "Amarillo": "#F9A825", "Azul": "#1565C0", "Gris": "#757575", "Violeta": "#7B1FA2", "Otro": "#BDBDBD"};
const grupo = L.layerGroup().addTo(map);
const bounds = [];
SITIOS.forEach(s => {
  const m = L.circleMarker([s.lat, s.lon], {radius:8, color:'#fff', weight:2, fillColor:COL[s.cat]||'#999', fillOpacity:1});
  const popup = document.createElement('div');
  popup.className = 'popup-sitio';
  const titulo = document.createElement('div');
  titulo.className = 'popup-titulo';
  titulo.textContent = s.n;
  popup.appendChild(titulo);

  const subtitulo = document.createElement('div');
  subtitulo.className = 'popup-subtitulo';
  subtitulo.textContent = 'Trabajos a realizar';
  popup.appendChild(subtitulo);

  const lista = document.createElement('ul');
  lista.className = 'popup-trabajos';
  (s.tareas || []).forEach(trabajo => {
    const item = document.createElement('li');
    item.textContent = trabajo;
    lista.appendChild(item);
  });
  if (!lista.children.length) {
    const item = document.createElement('li');
    item.textContent = 'No hay trabajos registrados para este sitio';
    lista.appendChild(item);
  }
  popup.appendChild(lista);
  m.bindPopup(popup, {maxWidth:320});
  m.addTo(grupo);
  bounds.push([s.lat, s.lon]);
});
map.fitBounds(bounds, {padding:[30,30]});
const info = L.control({position:'bottomleft'});
info.onAdd = function(){ const d=L.DomUtil.create('div','info'); d.innerHTML='<b>Sitios de la lista</b><br><span style="color:#2E7D32">●</span> Aprobado <span style="color:#F9A825">●</span> Enviado <span style="color:#1565C0">●</span> En proceso <span style="color:#757575">●</span> Abierto <span style="color:#7B1FA2">●</span> Aprob.+Enviado<br>'+SITIOS.length+' sitios cargados'; return d; };
info.addTo(map);

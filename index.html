const oscuro = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {attribution:'Tiles &copy; Esri', maxZoom:16});
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'&copy; OpenStreetMap', maxZoom:19});
fetch('datos_mapa.json?t=' + Date.now()).then(r => r.ok ? r.json() : []).catch(() => []).then(datos => {
  const actual = new Map(datos.map(d => [String(d.c || '').trim().toUpperCase(), d]));
  SITIOS.forEach(s => {
    const d = actual.get(String(s.c || '').trim().toUpperCase());
    if (d) {
      // Si Excel trae identificadores TA, conservar los nombres descriptivos ya asociados al sitio.
      // Si trae nombres de tareas, usar esos nombres.
      const tareasExcel = Array.isArray(d.tareas) ? d.tareas : [];
      const sonCodigosTA = tareasExcel.length > 0 && tareasExcel.every(t => /^TA-\d{2}-\d+$/i.test(String(t).trim()));
      if (tareasExcel.length && !sonCodigosTA) s.tareas = tareasExcel;
      s.estadoActual = (d.estados || []).join(', ');
      s.fechasPlan = (d.fechas || []).join(', ');
      if (d.n) s.n = d.n;
    }
  });
  const map = L.map('map', {layers:[calles]});
L.control.layers({'Mapa de calles':calles,'Mapa oscuro':oscuro,'OpenStreetMap':osm}).addTo(map);
const COL={"Verde": "#2E7D32", "Amarillo": "#F9A825", "Azul": "#1565C0", "Gris": "#757575", "Violeta": "#7B1FA2", "Otro": "#BDBDBD"};
const grupo = L.layerGroup().addTo(map);
const bounds = [];
SITIOS.forEach(s => {
  const m = L.circleMarker([s.lat, s.lon], {radius:8, color:'#fff', weight:2, fillColor:COL[s.cat]||'#999', fillOpacity:1});
  const popup = document.createElement('div');
  popup.className = 'popup-sitio';
  const titulo = document.createElement('div');
  titulo.className = 'popup-titulo';
  titulo.textContent = s.n;
  popup.appendChild(titulo);
  if (s.estadoActual || s.fechasPlan) {
    const detalle = document.createElement('div');
    detalle.className = 'popup-subtitulo';
    detalle.textContent = [s.estadoActual ? 'Estado: ' + s.estadoActual : '', s.fechasPlan ? 'Fecha de plan: ' + s.fechasPlan : ''].filter(Boolean).join(' · ');
    popup.appendChild(detalle);
  }

  const subtitulo = document.createElement('div');
  subtitulo.className = 'popup-subtitulo';
  subtitulo.textContent = 'Trabajos a realizar';
  popup.appendChild(subtitulo);

  const lista = document.createElement('ul');
  lista.className = 'popup-trabajos';
  (s.tareas || []).forEach(trabajo => {
    const item = document.createElement('li');
    item.textContent = trabajo;
    lista.appendChild(item);
  });
  if (!lista.children.length) {
    const item = document.createElement('li');
    item.textContent = 'No hay trabajos registrados para este sitio';
    lista.appendChild(item);
  }
  popup.appendChild(lista);
  const acciones = document.createElement('div');
  acciones.className = 'popup-acciones';
  const navegar = document.createElement('a');
  navegar.href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(s.lat + ',' + s.lon);
  navegar.target = '_blank'; navegar.rel = 'noopener'; navegar.textContent = 'Cómo llegar';
  const compartir = document.createElement('a');
  compartir.className = 'whatsapp';
  const enlaceSitio = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.lat + ',' + s.lon);
  compartir.href = 'https://wa.me/?text=' + encodeURIComponent('Sitio ' + s.c + ' - ' + s.n + ': ' + enlaceSitio);
  compartir.target = '_blank'; compartir.rel = 'noopener'; compartir.textContent = 'Compartir ubicación';
  acciones.append(navegar, compartir); popup.appendChild(acciones);
  m.bindPopup(popup, {maxWidth:320});
  m.addTo(grupo);
  bounds.push([s.lat, s.lon]);
});
const marcadores = new Map();
grupo.eachLayer(m => { const ll=m.getLatLng(); const sitio=SITIOS.find(x=>x.lat===ll.lat && x.lon===ll.lng); if(sitio) marcadores.set(sitio.c,m); });
function normalizar(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function estadoDe(s){return String(s.estadoActual || s.lab || '').toLowerCase();}
function fechaDe(s){const v=String(s.fechasPlan||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return v?new Date(+v[3],+v[2]-1,+v[1]).getTime():Infinity;}
function coincideEstado(s,f){if(!f)return true;const e=estadoDe(s);return e.includes(f.toLowerCase());}
function sitiosFiltrados(){
 const q=normalizar(document.getElementById('buscar-sitio').value), z=document.getElementById('filtro-zona').value, e=document.getElementById('filtro-estado').value;
 return SITIOS.filter(s=>(!q||normalizar(s.c+' '+s.n+' '+(s.ci||'')).includes(q))&&(!z||s.p===z)&&coincideEstado(s,e));
}
function actualizarPanel(){
 const lista=sitiosFiltrados(), orden=document.getElementById('orden-sitios').value;
 lista.sort((a,b)=>orden==='fecha'?fechaDe(a)-fechaDe(b):orden==='nombre'?a.n.localeCompare(b.n,'es'):orden==='codigo'?a.c.localeCompare(b.c):0);
 grupo.clearLayers();
 lista.forEach(s=>{const m=marcadores.get(s.c);if(m)m.addTo(grupo);});
 const cuenta=(f)=>SITIOS.filter(s=>coincideEstado(s,f)).length;
 document.getElementById('contadores-sitios').innerHTML='<div class="stat"><b>'+SITIOS.length+'</b>Total</div><div class="stat"><b>'+lista.length+'</b>Coinciden</div><div class="stat"><b>'+SITIOS.filter(s=>coincideEstado(s,'abierto')||coincideEstado(s,'enviado')).length+'</b>Pendientes</div><div class="stat"><b>'+cuenta('en proceso')+'</b>En proceso</div><div class="stat"><b>'+cuenta('aprobado')+'</b>Aprobados</div>';
 const cont=document.getElementById('lista-resultados');cont.replaceChildren();
 lista.slice(0,40).forEach(s=>{const b=document.createElement('button');b.textContent=s.c+' · '+s.n+(s.fechasPlan?' · '+s.fechasPlan:'');b.onclick=()=>{const m=marcadores.get(s.c);if(m){map.setView([s.lat,s.lon],14);m.openPopup();}};cont.appendChild(b);});
 if(lista.length>40){const p=document.createElement('div');p.textContent='Mostrando los primeros 40 resultados.';cont.appendChild(p);}
}
['buscar-sitio','filtro-zona','filtro-estado','orden-sitios'].forEach(id=>document.getElementById(id).addEventListener(id==='buscar-sitio'?'input':'change',actualizarPanel));
document.getElementById('btn-limpiar').onclick=()=>{document.getElementById('buscar-sitio').value='';document.getElementById('filtro-zona').value='';document.getElementById('filtro-estado').value='';document.getElementById('orden-sitios').value='original';actualizarPanel();};
document.getElementById('btn-recorrido').onclick=()=>{
 const pendientes=sitiosFiltrados().slice();
 if(pendientes.length<2){alert('Aplicá filtros para seleccionar al menos dos sitios.');return;}
 const restantes=pendientes.slice(1), ruta=[pendientes[0]];
 while(restantes.length){const actual=ruta[ruta.length-1];let mejor=0,dist=Infinity;restantes.forEach((s,i)=>{const d=map.distance([actual.lat,actual.lon],[s.lat,s.lon]);if(d<dist){dist=d;mejor=i;}});ruta.push(restantes.splice(mejor,1)[0]);}
 const puntos=ruta.slice(0,10), origen=puntos[0], destino=puntos[puntos.length-1], paradas=puntos.slice(1,-1);
 const url='https://www.google.com/maps/dir/?api=1&origin='+origen.lat+','+origen.lon+'&destination='+destino.lat+','+destino.lon+'&waypoints='+paradas.map(s=>s.lat+','+s.lon).join('|')+'&travelmode=driving';
 window.open(url,'_blank','noopener');
 alert('Recorrido sugerido por cercanía: '+puntos.map(s=>s.c).join(' → ')+(ruta.length>10?'\nSe muestran los primeros 10 sitios. Aplicá un filtro para armar otro tramo.':''));
};
actualizarPanel();

// Panel plegable para liberar espacio del mapa en celulares
const panelTecnicos=document.getElementById('panel-tecnicos');
const togglePanel=document.getElementById('toggle-panel');
if(togglePanel){
 togglePanel.addEventListener('click',()=>{
  const plegado=panelTecnicos.classList.toggle('panel-plegado');
  togglePanel.textContent=plegado?'Mostrar filtros ▼':'Ocultar filtros ▲';
  togglePanel.setAttribute('aria-expanded',String(!plegado));
  setTimeout(()=>map.invalidateSize(),220);
 });
}

map.fitBounds(bounds, {padding:[30,30]});
const info = L.control({position:'bottomleft'});
info.onAdd = function(){ const d=L.DomUtil.create('div','info'); d.innerHTML='<b>Sitios de la lista</b><br><span style="color:#2E7D32">●</span> Aprobado <span style="color:#F9A825">●</span> Enviado <span style="color:#1565C0">●</span> En proceso <span style="color:#757575">●</span> Abierto <span style="color:#7B1FA2">●</span> Aprob.+Enviado<br>'+SITIOS.length+' sitios cargados'; return d; };
info.addTo(map);

const actualizado = L.control({position:'bottomright'});
actualizado.onAdd = function() {
  const d = L.DomUtil.create('div','info');
  d.innerHTML = '<b>Última actualización</b><br><span id="fecha-actualizacion">Pendiente de primera sincronización</span>';
  return d;
};
actualizado.addTo(map);
fetch('ultima_actualizacion.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('sin fecha'); return r.json(); })
  .then(data => {
    const valor = data && data.actualizado;
    const fecha = valor ? new Date(valor) : null;
    document.getElementById('fecha-actualizacion').textContent =
      !fecha || isNaN(fecha.getTime()) ? 'Pendiente de primera sincronización' :
      new Intl.DateTimeFormat('es-AR', { dateStyle:'short', timeStyle:'short', timeZone:'America/Argentina/Buenos_Aires', hourCycle:'h23' }).format(fecha) + ' hs';
  })
  .catch(() => { document.getElementById('fecha-actualizacion').textContent = 'Pendiente de primera sincronización'; });
});
</script></body></html>
